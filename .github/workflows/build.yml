
name: Build Miku Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle ausführen
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        run: gradle build --no-daemon

      - name: JAR als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: miku-companion
          path: build/libs/*.jar
          if-no-files-found: error
